name: CI

on:
  push:
    branches: [main]
  # The constraint floor is worth most before a merge, not after one.
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The constraint guard diffs the branch against its merge base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The locked jsdom 30 needs >= 22.22 (Vite 7 needs >= 22.12); "22" resolves to
          # the latest 22.x. The lockfile is committed, so CI installs exactly what
          # development installed.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Nothing at high or above, runtime or development: the test runner also
        # executes on a pull request. A deferral needs a row in CONSTRAINTS.md.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Constraints floor
        # Blocks the cheap road to green: a new suppression, a skipped or deleted
        # test, a disabled gate, or a loosened threshold in CONSTRAINTS.md.
        run: node scripts/check-constraints.mjs --base origin/main
