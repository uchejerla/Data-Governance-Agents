name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The locked jsdom 30 needs >= 22.22 (Vite 7 needs >= 22.12); "22" resolves to
          # the latest 22.x. The lockfile is committed, so CI installs exactly what
          # development installed.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
