version: 2

updates:
  # Runtime and tooling dependencies. Development packages are grouped so a week of
  # patch bumps arrives as one reviewable PR rather than a dozen.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
